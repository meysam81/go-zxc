name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  prettier:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run Prettier
        run: bunx prettier@v3 -w .
      - name: Commit if changed
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The following files were changed by prettier:"
            git status --porcelain

            git config user.name "github-actions[bot]"
            git config user.email "${{ github.actor_id }}+github-actions@users.noreply.github.com"
            git add .
            git commit -m "chore: format code with prettier" -m 'skip ci'
            git fetch origin "$HEAD_REF"
            git rebase "origin/$HEAD_REF"
            git push origin "HEAD:$HEAD_REF"
          else
            echo "No changes to commit"
          fi

  checks:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
      - name: Build and Test
        run: |
          go build -v ./...
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

  test-os:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - name: Run Tests
        run: go test -v -race ./...

  test-go-versions:
    strategy:
      matrix:
        go-version:
          - "1.21"
          - "1.22"
          - "1.23"
          - "1.24"
          - "1.25"
          - "1.*"
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run Tests
        run: go test -v -race ./...

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release-please
        name: Release please
        uses: googleapis/release-please-action@v4
        with:
          release-type: go

  release-note-generation:
    runs-on: ubuntu-latest
    permissions:
      models: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get commit log
        id: commits
        uses: actions/github-script@v7
        with:
          script: |
            var getCommits = async function() {
              var tags = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });

              var lastTag = tags.data.length > 0 ? tags.data[0].name : '';
              var commits = '';

              if (lastTag) {
                var comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: lastTag,
                  head: 'HEAD'
                });

                commits = comparison.data.commits
                  .map(function(commit) {
                    return commit.sha.substring(0, 7) + ' ' + commit.commit.message.split('\n')[0];
                  })
                  .join('\n');
              }

              core.setOutput('commits', commits);
            };

            await getCommits();
      - name: Run model
        uses: ai-action/ollama-action@v2
        id: model
        with:
          model: llama3.2:3b
          prompt: |
            Generate release notes from these commits. Be concise. Format as markdown with sections for Features, Fixes, and Other.

            Commits:
            ${{ steps.commits.outputs.commits }}
      - name: Print response
        run: echo "$response"
        env:
          response: ${{ steps.model.outputs.response }}
      - name: Test Local Action
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Generate release notes from these commits. Be concise. Format as markdown with sections for Features, Fixes, and Other.

            Commits:
            ${{ steps.commits.outputs.commits }}
      - name: Print response
        run: echo "$response"
        env:
          response: ${{ steps.inference.outputs.response }}
